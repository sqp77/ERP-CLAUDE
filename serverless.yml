# Deployment pipeline (written, NOT run yet — docs/DECISIONS.md §1 "Pending before staging").
# Requires: AWS account + region decision, MongoDB Atlas URI and secrets in SSM Parameter Store.
service: eayni-erp
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'me-south-1'}
  stage: ${opt:stage, 'staging'}
  memorySize: 1024
  timeout: 29
  architecture: arm64
  environment:
    NODE_ENV: production
    STAGE: ${self:provider.stage}
    MONGODB_URI: ${ssm:/eayni/${self:provider.stage}/mongodb-uri}
    APP_SECRET: ${ssm:/eayni/${self:provider.stage}/app-secret}
    FILE_STORAGE: s3
    S3_BUCKET: ${self:service}-${self:provider.stage}-files
    # The CloudFront origin below (or the custom domain pointed at it): web and API share this origin,
    # so the SameSite=Lax session cookie and relative /api/v1 calls work (review F2).
    APP_URL: ${ssm:/eayni/${self:provider.stage}/app-url}
    COOKIE_SECURE: 'true'
    # Requests must come through CloudFront (follow-up 2): the distribution adds this secret origin header and the
    # API rejects anything without it; the client IP is read from CloudFront-Viewer-Address, not from X-Forwarded-For.
    ORIGIN_SECRET: ${ssm:/eayni/${self:provider.stage}/origin-secret}
    TRUST_PROXY_HOPS: '0'
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
          Resource: arn:aws:s3:::${self:service}-${self:provider.stage}-files/*
        - Effect: Allow
          Action: [ses:SendEmail, ses:SendRawEmail]
          Resource: '*'

package:
  individually: true

functions:
  api:
    handler: apps/api/src/handlers/api.handler
    events:
      - httpApi: '*'
  outbox:
    handler: apps/api/src/handlers/outbox.handler
    timeout: 120
    events:
      - schedule: rate(1 minute)
  jobs:
    handler: apps/api/src/handlers/jobs.handler
    timeout: 300
    events:
      # Review F3: two cadences. Frequent (reminders, news windows, task due/overdue, account deactivation,
      # ticket follow-ups) every 5 minutes; daily (birthdays, expiry alerts, overdue digests, queue reminders) at 06:00 Riyadh.
      - schedule:
          rate: rate(5 minutes)
          input: { cadence: frequent }
      - schedule:
          rate: cron(0 3 * * ? *)
          input: { cadence: daily }

resources:
  Resources:
    FilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-files
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              # Only the web app origin may talk to the bucket (review C15); presigned URLs carry the auth.
              AllowedOrigins:
                - ${ssm:/eayni/${self:provider.stage}/app-url}
              AllowedHeaders: [Content-Type, Content-Length]
              MaxAge: 3000

    # ---- Web hosting (review F2): private S3 bucket behind CloudFront (OAC); /api/* goes to the HTTP API ----
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-web
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-web-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub '${WebBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service} ${self:provider.stage} — web + /api
          HttpVersion: http2and3
          DefaultRootObject: index.html
          PriceClass: PriceClass_200
          # Custom domain + ACM certificate (us-east-1) are added once DECISIONS §1 items 3 and 5 are decided:
          # Aliases: [...] / ViewerCertificate: { AcmCertificateArn: ..., SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig: { OriginAccessIdentity: '' }
            - Id: api
              DomainName: !Select [1, !Split ['//', !GetAtt HttpApi.ApiEndpoint]]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              # Proof the request came through CloudFront (go-live follow-up 2); the API rejects requests without it.
              OriginCustomHeaders:
                - HeaderName: x-origin-secret
                  HeaderValue: ${ssm:/eayni/${self:provider.stage}/origin-secret}
          DefaultCacheBehavior:
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            # SPA fallback (follow-up 1): paths without a file extension are rewritten to /index.html on the web
            # behaviour only, so /api/* keeps its real 403/404 status codes and bodies.
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebSpaRewriteFunction.FunctionARN
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
    # Forwards everything the viewer sent plus CloudFront-Viewer-Address, the API's source of the client IP (follow-up 2).
    ApiOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-${self:provider.stage}-api-origin
          Comment: all viewer headers except Host, plus CloudFront-Viewer-Address
          CookiesConfig: { CookieBehavior: all }
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig:
            HeaderBehavior: allViewerAndWhitelistCloudFront
            Headers: [CloudFront-Viewer-Address]
    WebSpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:provider.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: SPA routes (no file extension) → /index.html; attached to the web behaviour only
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            if (uri.startsWith('/api/')) return request;
            var last = uri.substring(uri.lastIndexOf('/') + 1);
            if (last.indexOf('.') === -1) request.uri = '/index.html';
            return request;
          }
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionDomain:
      Value: !GetAtt WebDistribution.DomainName
      Description: Set /eayni/<stage>/app-url to https://<this value> (or the custom domain) before the first deploy of the API

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    format: esm
