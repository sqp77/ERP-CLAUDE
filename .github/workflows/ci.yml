name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
        env:
          CI: 'true'
      - run: npm run build -w apps/web

  # Deploy to staging is intentionally not wired: see docs/DECISIONS.md §1 "Pending before staging".
  # When the AWS account, region and secrets exist, add a job here that runs
  #   npx serverless deploy --stage staging
  # on pushes to main, after `check` passes. Never deploy to prod from this workflow or a laptop.
